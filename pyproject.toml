[project]
name = "orion"
version = "0.1.0"
description = "JAX crop growth model for real-world agriculture"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flax>=0.12.6",
    "nicegui>=3.17.1",
    "platformdirs>=4.3.0",
    "openmeteo-requests>=1.7.5",
    "plotly>=7.1.0",
    "requests-cache>=1.3.2",
    "retry-requests>=2.0.0",
    "shapely>=2.1.2",
    "jax-datetime>=0.1.2",
    "jax[cuda13]>=0.10.0",
]

[project.scripts]
orion-ui = "orion.ui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.uv.sources]
jax-datetime = { git = "https://github.com/google/jax-datetime" }

[tool.hatch.build.targets.wheel]
packages = ["orion"]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "pyright>=1.1.414",
    "ruff>=0.15.11",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "jupyter>=1.1.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.15.11",
]

[tool.black]
line-length = 250
target-version = ["py314"]

[tool.ruff]
line-length = 250
fix = true

[tool.ruff.lint]
extend-select = ["E", "F", "W", "B", "C90", "I"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.pyright]
include = ["orion", "tests", "demo.py"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
